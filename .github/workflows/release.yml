name: release

on:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Build and test
        run: sh ./mvnw -B -ntp verify

  release:
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Build and package
        run: sh ./mvnw -B -ntp verify

      - name: Name the release after the commit
        id: tag
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-8)
          tag="build-$short"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "the release is named $tag"

      - name: Create the release, if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "[INFO] release $tag already exists, nothing to do."
            exit 0
          fi

          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

          gh release create "$tag" \
            --title "Rooms $tag" \
            --generate-notes \
            --verify-tag \
            "target/rooms.zip"

          echo "[OK] released $tag with target/rooms.zip attached."
